# Production stack on a single VPS:  docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d
# See docs/DEPLOY.md. Object storage is Cloudflare R2 (not part of this stack).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: salmon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: salmon
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U salmon']
      interval: 10s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: be/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://salmon:${POSTGRES_PASSWORD}@postgres:5432/salmon
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?}
      WEB_BASE_URL: https://${WEB_DOMAIN:?}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?}
      R2_BUCKET_MEDIA: ${R2_BUCKET_MEDIA:-blog-media}
      R2_BUCKET_WIDGETS: ${R2_BUCKET_WIDGETS:-blog-widgets}
      R2_PUBLIC_MEDIA_URL: ${R2_PUBLIC_MEDIA_URL:?}
      R2_PUBLIC_WIDGETS_URL: ${R2_PUBLIC_WIDGETS_URL:?}
      SENTRY_DSN: ${SENTRY_DSN:-}
    ports:
      - '127.0.0.1:4000:4000' # also reachable by the web image build (see docs/DEPLOY.md)

  # `next build` prerenders from the API, so build with host networking against the already-running API:
  #   docker compose up -d postgres api && docker compose build web && docker compose up -d web
  web:
    build:
      context: ..
      dockerfile: fe/Dockerfile
      network: host
      args:
        API_INTERNAL_URL: http://127.0.0.1:4000/api/v1
        NEXT_PUBLIC_API_URL: https://${API_DOMAIN:?}/api/v1
        NEXT_PUBLIC_SITE_URL: https://${WEB_DOMAIN}
        WIDGETS_BASE_URL: ${R2_PUBLIC_WIDGETS_URL}
        MEDIA_ORIGIN: ${R2_PUBLIC_MEDIA_URL}
    restart: unless-stopped
    depends_on: [api]
    environment:
      API_INTERNAL_URL: http://api:4000/api/v1
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      WIDGETS_BASE_URL: ${R2_PUBLIC_WIDGETS_URL}
      MEDIA_ORIGIN: ${R2_PUBLIC_MEDIA_URL}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [web, api]
    ports:
      - '80:80'
      - '443:443'
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certs:/etc/nginx/certs:ro # fullchain.pem + privkey.pem, e.g. from certbot or a Cloudflare origin certificate

  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGHOST: postgres
      PGUSER: salmon
      PGDATABASE: salmon
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ['/bin/bash', '/backup.sh']

volumes:
  pgdata:
  certs:
