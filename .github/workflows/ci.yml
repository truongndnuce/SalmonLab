name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: salmon, POSTGRES_PASSWORD: salmon, POSTGRES_DB: salmon }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U salmon" --health-interval 5s --health-timeout 5s --health-retries 10
      storage: # S3-compatible store for the media/widget e2e tests
        image: rustfs/rustfs:latest
        env: { RUSTFS_ACCESS_KEY: salmon, RUSTFS_SECRET_KEY: salmon-secret, RUSTFS_ADDRESS: ':9000' }
        ports: ['9000:9000']
    env:
      DATABASE_URL: postgresql://salmon:salmon@localhost:5432/salmon
      JWT_ACCESS_SECRET: ci-access
      JWT_REFRESH_SECRET: ci-refresh
      REVALIDATE_SECRET: ci-revalidate
      LOGIN_RATE_LIMIT: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from "packageManager" in package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit tests
        run: pnpm turbo run lint typecheck test
      - name: Backend e2e (supertest)
        run: pnpm --filter @salmon/be test:e2e

      - name: Start the API with seed data
        run: |
          pnpm --filter @salmon/be exec prisma migrate deploy
          pnpm --filter @salmon/be db:seed
          pnpm --filter @salmon/be build
          (cd be && PORT=4000 node dist/main.js > /tmp/api.log 2>&1 &)
          npx --yes wait-on http://localhost:4000/api/v1/health --timeout 60000
      - name: Build the web app (prerenders from the API)
        run: pnpm --filter @salmon/fe build
        env:
          API_INTERNAL_URL: http://localhost:4000/api/v1
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      - name: Browser tests (Playwright)
        run: |
          pnpm --filter @salmon/fe exec playwright install --with-deps chromium
          (cd fe && pnpm exec next start -p 3000 > /tmp/web.log 2>&1 &)
          npx --yes wait-on http://localhost:3000 --timeout 60000
          pnpm --filter @salmon/fe test:e2e
        env:
          API_INTERNAL_URL: http://localhost:4000/api/v1
          REVALIDATE_SECRET: ci-revalidate
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics
          path: |
            /tmp/api.log
            /tmp/web.log
            fe/test-results
            fe/playwright-report
          if-no-files-found: ignore

  images:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build the API image
        run: docker build -f be/Dockerfile -t salmon-api:ci .
